<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо-режим: киоск + кухня + табло — ПОРЦИЯ</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #14131a; }
  .demo { display: grid; grid-template-columns: 1.55fr 1fr; grid-template-rows: 46px 1fr; height: 100vh; gap: 8px; padding: 8px; }
  .demo-bar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: #1b1a23; border-radius: 12px;
    padding: 0 14px; color: #cfc7d8; font-size: 13.5px;
  }
  .demo-bar b { color: #fff; font-size: 14px; }
  .demo-bar .sep { flex: 1; }
  .demo-bar a { color: #b8b2c2; font-size: 13px; padding: 6px 10px; border-radius: 8px; }
  .demo-bar a:hover { background: rgba(255,255,255,.07); color: #fff; }
  .pane { border-radius: 14px; overflow: hidden; background: #000; position: relative; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; }
  .pane .tag {
    position: absolute; top: 8px; left: 8px; z-index: 2; background: rgba(20,19,26,.82); color: #fff;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; padding: 5px 10px; border-radius: 999px;
    backdrop-filter: blur(4px); pointer-events: none;
  }
  .pane .open { position: absolute; top: 8px; right: 8px; z-index: 2; background: rgba(20,19,26,.82); color: #cfc7d8;
    font-size: 11.5px; padding: 5px 10px; border-radius: 999px; }
  .pane .open:hover { color: #fff; background: rgba(20,19,26,.95); }
  .demo-right { display: grid; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 0; }
  .pane.kiosk-pane iframe { background: #efeae3; }
</style>
</head>
<body>
<div class="demo">
  <div class="demo-bar">
    <b>ПОРЦИЯ · демо в одном окне</b>
    <span>слева — киоск гостя, справа — кухня и табло выдачи</span>
    <div class="sep"></div>
    <span class="pill pill--live" style="background:#26242f;color:#58d3a0">live</span>
    <a href="/kiosk" target="_blank">Киоск ↗</a>
    <a href="/kitchen" target="_blank">Кухня ↗</a>
    <a href="/board" target="_blank">Табло ↗</a>
    <a href="/admin" target="_blank">Панель ↗</a>
  </div>

  <div class="pane kiosk-pane">
    <span class="tag">КИОСК ГОСТЯ</span>
    <a class="open" href="/kiosk" target="_blank">Открыть отдельно ↗</a>
    <iframe src="/kiosk" title="Киоск"></iframe>
  </div>

  <div class="demo-right">
    <div class="pane">
      <span class="tag">КУХНЯ</span>
      <a class="open" href="/kitchen" target="_blank">Открыть ↗</a>
      <iframe src="/kitchen" title="Кухня"></iframe>
    </div>
    <div class="pane">
      <span class="tag">ТАБЛО ВЫДАЧИ</span>
      <a class="open" href="/board" target="_blank">Открыть ↗</a>
      <iframe src="/board" title="Табло выдачи"></iframe>
    </div>
  </div>
</div>
</body>
</html>
